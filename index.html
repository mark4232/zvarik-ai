
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zvarik AI - Image Generator</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:white;font-family:Arial,sans-serif}
header{padding:22px 7%;display:flex;justify-content:space-between;
align-items:center;border-bottom:1px solid #252d43}
.logo{font-size:25px;font-weight:bold;color:#a78bfa}
.tag{color:#b9c2d9;font-size:13px}
main{max-width:850px;margin:65px auto;padding:20px;text-align:center}
h1{font-size:clamp(34px,6vw,56px);margin-bottom:15px}
h1 span{color:#a78bfa}
p{color:#aab4ce;line-height:1.7}
.panel{margin-top:35px;background:#151c30;padding:22px;
border:1px solid #303954;border-radius:18px;text-align:left}
label{display:block;margin:15px 0 10px;font-weight:bold}
textarea,select{width:100%;padding:15px;background:#0b1020;
color:white;border:1px solid #39435e;border-radius:10px;font-size:15px}
textarea{height:125px;resize:vertical}
button{width:100%;padding:15px;margin-top:18px;border:0;
border-radius:10px;background:#8b5cf6;color:white;
font-size:16px;font-weight:bold;cursor:pointer}
button:hover{background:#7544e8}
#message{display:none;margin-top:20px;padding:15px;
background:#202944;border-radius:10px;line-height:1.6}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);
gap:12px;margin-top:30px}
.tile{background:#151c30;border:1px solid #303954;
border-radius:12px;padding:24px 8px;color:#d5ccff}
footer{text-align:center;padding:30px;color:#7f8ba8;font-size:13px}
@media(max-width:550px){main{margin:30px auto}
.gallery{grid-template-columns:1fr}header{padding:18px}}
</style>
</head>
<body>
<header>
  <div class="logo">✦ Zvarik AI</div>
  <div class="tag">AI Image Studio</div>
</header>
<main>
  <p>YOUR IMAGINATION, YOUR CREATION</p>
  <h1>Create Amazing Images with <span>AI</span></h1>
  <p>Describe your idea and turn your imagination into art.</p>
  <section class="panel">
    <label for="prompt">Describe your image</label>
    <textarea id="prompt" placeholder="A beautiful mosque at sunset, cinematic lighting, ultra detailed..."></textarea>
    <label for="style">
<label for="size">Choose image size</label>
<select id="size">
  <option value="square">Square (1:1)</option>
  <option value="portrait">Portrait (2:3)</option>
  <option value="landscape">Landscape (3:2)</option>
</select>
    <button onclick="generate()">✦ Generate Image</button>
    <div id="message" role="status"></div>
  </section>
  <h2>Explore Your Creativity</h2>
  <div class="gallery">
    <div class="tile">✧ Realistic Art</div>
    <div class="tile">✧ 3D Characters</div>
    <div class="tile">✧ Fantasy Worlds</div>
  </div>
</main>
<footer>© 2026 Zvarik AI · Imagine. Create. Inspire.</footer>

<script>
async function generate() {
  const prompt = document.getElementById('prompt').value.trim();
  const style = document.getElementById('style').value;
  const size = document.getElementById('size').value;
  const message = document.getElementById('message');
  const button = document.querySelector('button');

  message.style.display = 'block';

  if (!prompt) {
    message.textContent = 'Please describe the image you want to create.';
    return;
  }

  button.disabled = true;
  button.textContent = 'Generating...';
  message.replaceChildren();

  const status = document.createElement('p');
  status.textContent = 'Creating your image. Please wait...';
  message.appendChild(status);

  try {
    const response = await fetch('/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt, style, size })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || 'Image generation failed.');
    }

    if (!data.image) {
      throw new Error('No image was returned. Please try again.');
    }

    message.replaceChildren();

    const heading = document.createElement('p');
    heading.textContent = 'Your AI image is ready!';
    message.appendChild(heading);

    const img = document.createElement('img');
    img.src = data.image;
    img.alt = 'AI-generated image';
    img.style.width = '100%';
    img.style.display = 'block';
    img.style.marginTop = '12px';
    img.style.borderRadius = '12px';
    message.appendChild(img);

    const download = document.createElement('a');
    download.href = data.image;
    download.download = 'zvarik-ai-image.jpg';
    download.textContent = 'Download Image';
    download.style.display = 'inline-block';
    download.style.marginTop = '16px';
    download.style.color = '#c4b5fd';
    download.style.fontWeight = 'bold';
    message.appendChild(download);

  } catch (error) {
    message.replaceChildren();
    const errorText = document.createElement('p');
    errorText.textContent = error.message ||
      'Something went wrong. Please try again.';
    message.appendChild(errorText);
  } finally {
    button.disabled = false;
    button.textContent = '✦ Generate Image';
  }
}
</script>
